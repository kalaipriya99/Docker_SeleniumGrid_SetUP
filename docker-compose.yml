services:
  selenium-hub:
    image: selenium/hub:4.24.0
    container_name: selenium-hub
    ports:
      - "4444:4444"
    networks:
      - pipeline_automation_grid
    environment:
      - GRID_MAX_SESSION=2
      - GRID_BROWSER_TIMEOUT=300

  chrome:
    image: selenium/node-chrome:4.24.0
    container_name: selenium-chrome
    shm_size: 2g
    depends_on:
      - selenium-hub
    environment:
      - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_GRID_URL=http://selenium-hub:4444
      - SE_NODE_BROWSER_ARGS=--headless=new --no-sandbox --disable-dev-shm-usage --disable-gpu --disable-software-rasterizer --disable-features=VizDisplayCompositor --remote-allow-origins=* --window-size=1920,1080
    networks:
      - pipeline_automation_grid

  firefox:
    image: selenium/node-firefox:4.24.0
    container_name: selenium-firefox
    shm_size: 2g
    depends_on:
      - selenium-hub
    environment:
       - SE_EVENT_BUS_HOST=selenium-hub
      - SE_EVENT_BUS_PUBLISH_PORT=4442
      - SE_EVENT_BUS_SUBSCRIBE_PORT=4443
      - SE_NODE_MAX_SESSIONS=1
      - SE_NODE_SESSION_TIMEOUT=300
      - SE_NODE_OVERRIDE_MAX_SESSIONS=true
      - SE_NODE_GRID_URL=http://selenium-hub:4444
      - MOZ_HEADLESS=1
      - SE_NODE_BROWSER_ARGS=--headless --width=1920 --height=1080
    networks:
      - pipeline_automation_grid

  tests:
    build: .
    container_name: selenium-tests
    depends_on:
      - selenium-hub
      - chrome
      - firefox
    networks:
      - pipeline_automation_grid
    volumes:
      - ./src:/app/src
      - ./pom.xml:/app/pom.xml
      - ./reports:/app/reports
      - ./target:/app/target
      - ./screenshots:/app/screenshots
    environment:
      - MAVEN_OPTS=-Xmx512m
      - HUB_URL=http://selenium-hub:4444/wd/hub
    command: >
       /bin/bash -c "
      echo 'Waiting for Selenium Nodes...';
      until curl -s http://selenium-hub:4444/status | grep -q 'ready'; do
        echo 'Hub not ready yet...';
        sleep 3;
      done;
      echo 'Waiting for Chrome Node...';
      until curl -s http://selenium-hub:4444/ui/ | grep -q 'chrome'; do
        sleep 3;
      done;
      echo 'Waiting for Firefox Node...';
      until curl -s http://selenium-hub:4444/ui/ | grep -q 'firefox'; do
        sleep 3;
      done;
      echo 'All nodes ready. Starting tests.';
      mvn clean test -Dextent.output.dir=/app/reports
      "

networks:
  pipeline_automation_grid:
    driver: bridge
